<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f4f0e7">
<link rel="manifest" href="manifest.webmanifest">

<title>NoBo NoFo — Nine Book Reader</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#f4f0e7;color:#171717;font-family:Georgia,"Times New Roman",serif}
button,input,textarea{font:inherit} button{cursor:pointer}
html,body{width:100%;max-width:100%;overflow:hidden} #app{width:100%;max-width:100%;height:100%;overflow:hidden}
.top{height:54px;padding:8px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #bbb;background:#f8f5ee}
.top .title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px}
.top button,.editorbar button,.importLabel{border:1px solid #999;background:#fff;padding:7px 9px;border-radius:7px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:12px}
.library{height:calc(100% - 54px);overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:start}
.book{min-height:145px;border:1px solid #aaa;background:#fff;padding:13px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 6px #0002}
.book h2{font-size:18px;margin:0 0 8px}.book p{font-size:12px;margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#555}
.contents{height:calc(100% - 54px);overflow:auto;padding:18px;max-width:700px;margin:auto}
.contents h1{font-size:25px}.chapter{width:100%;text-align:left;border:0;border-bottom:1px solid #ccc;background:transparent;padding:13px 4px;font-size:16px}
.reader{height:calc(100% - 54px);position:relative;overflow:hidden}
.page{height:100%;max-width:640px;margin:auto;padding:34px 30px 54px;overflow:auto;background:#fff;box-shadow:0 0 20px #0001}
.page h1{font-size:20px;text-align:center;margin:0 0 32px}.page p{font-size:17px;line-height:1.48;text-align:justify;margin:0 0 .75em}.page p+p{text-indent:1.2em}
.pageno{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:#666;pointer-events:none}
.hit{position:absolute;top:0;bottom:0;width:22%;z-index:3}.hit.left{left:0}.hit.right{right:0}
.editorbar{position:absolute;left:8px;right:8px;bottom:8px;z-index:8;display:flex;gap:6px;align-items:center;background:#eeeef5e8;padding:7px;border:1px solid #999;border-radius:9px;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.editorbar .spacer{flex:1}.dirty{font-size:11px}
.editor{position:absolute;inset:54px 0 0;background:#eee;z-index:10;padding:12px;display:flex;flex-direction:column;gap:8px}
.editor textarea{flex:1;width:100%;resize:none;padding:14px;font:16px/1.45 Georgia,serif}
.editor input{padding:8px}.editor .row{display:flex;gap:7px;align-items:center}.editor .row button{padding:8px}
.hidden{display:none!important}
#fileInput{display:none}
@media(max-width:650px){.library{gap:8px;padding:10px}.book{min-height:125px;padding:9px}.book h2{font-size:14px}.page{padding:28px 22px 58px}.page p{font-size:16px}}

.searchOverlay{position:fixed;inset:0;background:#f6f2e9;z-index:40;padding:18px;color:#222}
.searchOverlay .searchbar{display:flex;gap:8px;margin:12px 0}
.searchOverlay input{flex:1;font-size:18px;padding:11px;border:1px solid #aaa;border-radius:8px;background:white}
.searchOverlay .result{display:block;width:100%;text-align:left;padding:15px 4px;border:0;border-bottom:1px solid #ccc;background:none}
.searchOverlay .result b{display:block;font-size:17px}.searchOverlay .result small{display:block;margin-top:5px;color:#666}

/* PASS 5 bundled camouflage */
.libraryScreen{height:100%;background:#fff;display:flex;justify-content:center;overflow:hidden}
.libraryArtWrap{position:relative;width:min(100vw,421px);aspect-ratio:421/729;background:#fff}
.libraryArt{display:block;width:100%;height:auto}
.libHit{position:absolute;border:0;background:transparent;padding:0}
.adminHot{position:absolute;right:0;bottom:0;width:20%;height:64px;z-index:5;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.adminPanel{position:fixed;inset:auto 12px 14px 12px;z-index:60;background:#f8f5ee;border:1px solid #999;border-radius:10px;padding:10px;display:flex;gap:8px;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.coverSplash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;align-items:center;justify-content:center}
.coverSplash img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;clip-path:inset(0 0 0 2px)}
.contents{padding:0 18px 72px}
.contentsHead{display:flex;gap:15px;align-items:flex-start;padding:18px 0 14px;border-bottom:1px solid #ccc}
.contentsHead img{width:74px;height:112px;object-fit:contain;background:#fff}
.contentsHead h1{margin:9px 0 4px;font-size:23px}.contentsHead p{margin:0;color:#666;font:13px/1.3 -apple-system,BlinkMacSystemFont,sans-serif}
.contentsBase{position:fixed;left:0;right:0;bottom:0;height:52px;background:#fff url("assets/CONTENTS_BASE.png") center/auto 52px no-repeat;border-top:1px solid #ddd}
.searchOverlay{font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.searchOverlay .top{margin:-18px -18px 12px}


.buildId{
  position:absolute;
  right:28px;
  top:4px;
  bottom:auto;
  z-index:30;
  font:500 9px/1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  letter-spacing:.15px;
  color:rgba(70,70,70,.62);
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}


/* 5G — explicit Library viewport/scroll structure */
html,body,#app{width:100%;max-width:100%;overflow-x:hidden}
.libraryScreen{width:100%;max-width:100%;overflow:hidden}
.libraryArtWrap{
  position:relative;
  width:100%;
  max-width:421px;
  height:100%;
  max-height:729px;
  background:#fff;
  overflow:hidden;
}
.libraryScroll{
  position:absolute;
  left:0; right:0; top:0; bottom:64px;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  z-index:1;
}
.libraryScroll>div{
  position:relative;
  padding-bottom:52px;
}
.libraryBase{
  position:absolute;
  left:0; right:0; bottom:0;
  width:100%;
  height:auto;
  z-index:10;
  display:block;
}


/* 5H UI chrome typography */
.top,.top *, .contentsHead, .contentsHead *, .chapter,
.searchOverlay,.searchOverlay *, .adminPanel,.adminPanel *,
.importLabel,.libraryScreen{
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}


/* 5H maintenance sheet */
.adminPanel{
  position:fixed !important;
  left:12px !important; right:12px !important; bottom:14px !important;
  top:auto !important;
  z-index:1000 !important;
  min-height:58px;
  background:#f2f2f2 !important;
  border:1px solid #aaa !important;
  border-radius:10px !important;
  padding:10px !important;
  display:flex !important;
  align-items:center;
  gap:8px;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
.adminPanel button,.adminPanel .importLabel{
  appearance:none;-webkit-appearance:none;
  border:1px solid #999;background:#fff;color:#222;
  border-radius:7px;padding:9px 12px;font-size:12px;line-height:1;
}
.adminPanel input[type=file]{display:none}


/* 5I — MORE is a genuine control above a non-interactive base image */
.libraryBase{
  pointer-events:none !important;
  -webkit-user-select:none !important;
  user-select:none !important;
  -webkit-touch-callout:none !important;
}
.adminHot{
  position:absolute !important;
  right:0 !important;
  bottom:0 !important;
  width:20% !important;
  height:64px !important;
  z-index:50 !important;
  border:0 !important;
  margin:0 !important;
  padding:0 !important;
  background:transparent !important;
  appearance:none !important;
  -webkit-appearance:none !important;
  -webkit-user-select:none !important;
  user-select:none !important;
  -webkit-touch-callout:none !important;
  touch-action:none !important;
}


/* QA v5 — runtime refinement */
.page p{
  -webkit-hyphens:auto;
  hyphens:auto;
  overflow-wrap:normal;
}
.coverSplash{
  transform:translateX(0);
  transition:transform .30s ease-in;
  will-change:transform;
}
.coverSplash.coverExit{ transform:translateX(-105%); }

.jobsOpen{
  text-align:center;
  margin:0 0 26px;
  font-family:Georgia,"Times New Roman",serif;
}
.jobsChapNo{
  margin:0 0 10px;
  font:700 13px/1.15 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  letter-spacing:.08em;
  color:#000;
  text-transform:none;
}
.jobsChapTitle{
  margin:0 0 23px;
  font-size:29px;
  line-height:1.06;
  font-weight:700;
  color:#000;
}
.jobsSub{
  margin-left:auto;
  margin-right:auto;
  max-width:94%;
}
.jobsSub1{
  margin-top:0;
  margin-bottom:16px;
  font-size:20px;
  line-height:1.18;
  font-weight:700;
}
.jobsSub2{
  margin-top:0;
  margin-bottom:14px;
  font-size:16px;
  line-height:1.22;
  font-weight:500;
}
.jobsSub3{
  margin-top:0;
  margin-bottom:13px;
  font-size:14px;
  line-height:1.24;
  font-style:italic;
  font-weight:400;
}
.jobsSub4,.jobsSub5{
  margin-top:0;
  margin-bottom:11px;
  font:600 11px/1.28 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  letter-spacing:.055em;
  color:#777;
  text-transform:uppercase;
}
.jobsOpen + p{ text-indent:0 !important; }

</style>
</head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const state={screen:"library",meta:[],book:null,ci:0,pi:0,edit:false,dirty:new Set()};
const cache=new Map();
const clone=o=>JSON.parse(JSON.stringify(o));
const key=id=>"nobonofo-edits-"+id;
const COVER={
  jeeves:"assets/JEEVES.png", sotweed:"assets/SOTWEED.png", farewell:"assets/ERNEST.png",
  keef:"assets/KEEF.png", bloomfield:"assets/BLOOMERS.png", h2g2:"assets/H2G2.png",
  hst:"assets/HST.png", huck:"assets/HUCK.png", jobs:"assets/JOBS.png"
};
const LIB_ORDER=["jeeves","sotweed","farewell","keef","bloomfield","h2g2","hst","huck","jobs"];
const COVER_PRELOAD={};
for(const [id,src] of Object.entries(COVER)){
  const img=new Image(); img.src=src; COVER_PRELOAD[id]=img;
}

const MAGICKEY="nobonofo-magic-pass5m";
if(sessionStorage.getItem(MAGICKEY)===null){
  sessionStorage.setItem(MAGICKEY,JSON.stringify({phase:"READY",force:"",paid:null,dwell:null}));
}
const magic=Object.assign({phase:"READY",force:"",paid:null,dwell:null},JSON.parse(sessionStorage.getItem(MAGICKEY)||"{}"));
function saveMagic(){sessionStorage.setItem(MAGICKEY,JSON.stringify(magic))}
function resetMagic(){Object.assign(magic,{phase:"READY",force:"",paid:null,dwell:null});saveMagic();goLibrary()}
function cleanMagic(){if(magic.phase==="PAID"){magic.phase="CLEAN";magic.force="";saveMagic();render()}}
function armMagic(word){
  word=String(word||"").trim();
  if(!word)return;
  magic.phase="ARMED";magic.force=word;magic.paid=null;magic.dwell=null;saveMagic();
}
function pageKey(){return state.book?`${state.book.id}:${state.ci}:${state.pi}`:""}
function firstSentenceInject(text,word){
  if(!word)return text;
  if(text.includes("$$$"))return text.replaceAll("$$$",word);
  // Corpus currently has no prepared sockets. Pass 4 therefore leaves genuine prose untouched
  // unless a $$$ socket is deliberately present; no destructive automatic word replacement.
  return text;
}
function visibleParagraphs(p){
  const k=pageKey(),forceHere=magic.phase==="ARMED" || (magic.phase==="PAID"&&magic.paid===k);
  // Prepared force text is separate from the genuine page. This lets PAID/CLEAN
  // restore the real book everywhere except the exact payoff page.
  const paras=(forceHere && p.force_paragraphs) ? p.force_paragraphs : p.paragraphs;
  return paras.map(x=>forceHere?firstSentenceInject(x,magic.force):x);
}
function beginDwell(){
  clearTimeout(magic._timer);
  if(magic.phase!=="ARMED")return;
  const k=pageKey();
  magic.dwell={key:k,qualified:false};
  magic._timer=setTimeout(()=>{
    if(magic.phase==="ARMED"&&pageKey()===k&&magic.dwell?.key===k){
      magic.dwell.qualified=true; saveMagic();
    }
  },2200);
}
function maybeAutoPaid(departingKey){
  if(magic.phase==="ARMED"&&magic.dwell?.qualified&&magic.dwell.key===departingKey){
    magic.phase="PAID";magic.paid=departingKey;magic.dwell=null;saveMagic();
  }
}

async function init(){
  state.meta=await (await fetch("books/index.json",{cache:"no-store"})).json();
  render();
}
async function loadBook(id){
  if(cache.has(id)) return cache.get(id);
  const m=state.meta.find(x=>x.id===id);
  const fresh=await (await fetch(m.file,{cache:"no-store"})).json();
  let b=fresh;
  const saved=localStorage.getItem(key(id));
  if(saved){
    try{
      b=JSON.parse(saved);
      // Preserve local editorial changes, but merge newer prepared-force metadata
      // from the shipped book JSON. Old saved books predate force_paragraphs.
      fresh.chapters.forEach((fc,ci)=>{
        fc.pages.forEach((fp,pi)=>{
          const bp=b.chapters?.[ci]?.pages?.[pi];
          if(bp && fp.force_paragraphs && !bp.force_paragraphs){
            bp.force_paragraphs=fp.force_paragraphs;
          }
        });
      });
    }catch(e){ b=fresh; }
  }
  cache.set(id,b); return b;
}
function saveLocal(){
  if(!state.book)return;
  localStorage.setItem(key(state.book.id),JSON.stringify(state.book));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function currentPage(){return state.book.chapters[state.ci].pages[state.pi]}
function totalBookPages(){return state.book.chapters.reduce((n,c)=>n+c.pages.length,0)}
function absolutePage(){
  let n=1; for(let i=0;i<state.ci;i++)n+=state.book.chapters[i].pages.length; return n+state.pi;
}
function goLibrary(){state.screen="library";state.book=null;state.edit=false;render()}
async function openBook(id){
  const app=$("#app");
  // Cover is the immediate response to the tap. Do not render Contents first.
  const splash=document.createElement("div");
  splash.className="coverSplash";
  splash.style.visibility="visible";
  splash.innerHTML=`<img src="${COVER[id]}" alt="">`;
  app.appendChild(splash);

  const hold=new Promise(resolve=>setTimeout(resolve,1500));
  const loading=loadBook(id);
  const [_,book]=await Promise.all([hold,loading]);

  state.book=book; state.ci=0; state.pi=0; state.screen="contents";
  render();
  // Put the already-loaded cover back above Contents, then slide it away.
  // render() replaced #app contents, so re-append the same splash node synchronously;
  // the browser will paint Contents underneath, not Library.
  app.appendChild(splash);
  void splash.offsetWidth;
  splash.classList.add("coverExit");
  await new Promise(resolve=>setTimeout(resolve,300));
  splash.remove();
}
function openChapter(i){state.ci=i;state.pi=0;state.screen="reader";render()}
function pageMove(d){
  const departing=pageKey();
  let ci=state.ci,pi=state.pi+d;
  if(pi<0){if(ci===0)return;ci--;pi=state.book.chapters[ci].pages.length-1}
  if(pi>=state.book.chapters[ci].pages.length){if(ci===state.book.chapters.length-1)return;ci++;pi=0}

  const oldPage=document.querySelector(".page");
  const finish=()=>{
    maybeAutoPaid(departing);
    state.ci=ci;state.pi=pi;render();
    const incoming=document.querySelector(".page");
    if(incoming){
      incoming.style.transform=`translateX(${d>0?100:-100}%)`;
      incoming.style.transition="none";
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        incoming.style.transition="transform .22s ease-out";
        incoming.style.transform="translateX(0)";
      }));
    }
  };
  if(oldPage){
    oldPage.style.transition="transform .22s ease-out";
    oldPage.style.transform=`translateX(${d>0?-100:100}%)`;
    setTimeout(finish,220);
  }else finish();
}
function openH2G2Search(){
  if(!state.book || state.book.id!=="h2g2" || magic.phase!=="READY")return;
  const app=$("#app"),ov=document.createElement("div");ov.className="searchOverlay";
  ov.innerHTML=`<div class="top"><button id="sx">CANCEL</button><div class="title"><b>Search</b></div></div>
    <form id="searchForm" class="searchbar">
      <input id="secretSearch" autocomplete="off" autocapitalize="none" spellcheck="false"
             enterkeyhint="search" placeholder="Search this book">
    </form>
    <div id="results"></div>`;
  app.appendChild(ov);
  const inp=$("#secretSearch"),res=$("#results");
  inp.readOnly=false; inp.disabled=false; inp.focus({preventScroll:true}); inp.click();

  function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function genuineImprobabilityHits(){
    const hits=[];
    (state.book.chapters||[]).forEach((ch,ci)=>(ch.pages||[]).forEach((pg,pi)=>(pg.paragraphs||[]).forEach((para,pari)=>{
      const text=String(para||""),rx=/improbability/ig; let m;
      while((m=rx.exec(text))){
        const a=Math.max(0,m.index-62),b=Math.min(text.length,m.index+m[0].length+88);
        hits.push({ci,pi,pari,text,snip:(a?"…":"")+text.slice(a,b)+(b<text.length?"…":"")});
      }
    })));
    return hits;
  }
  function showReadable(hit){
    res.innerHTML=`<button class="result" id="backResults"><b>‹ Search results</b></button>
      <div style="padding:18px 14px;font:17px/1.45 Georgia,serif">${esc(hit.text)}</div>`;
    $("#backResults").onclick=showResults;
  }
  function showResults(){
    const hits=genuineImprobabilityHits();
    res.innerHTML=hits.map((h,i)=>`<button class="result${i===0?" readableResult":""}" data-hit="${i}">
      <b>improbability</b><small>Chapter ${h.ci+1} · ${esc(h.snip)}</small></button>`).join("");
    const first=res.querySelector(".readableResult");
    if(first)first.onclick=()=>showReadable(hits[Number(first.dataset.hit)]);
  }
  function submit(){
    const w=inp.value.trim();
    if(!w || w.toLowerCase()==="improbability")return;
    armMagic(w);
    inp.value="improbability";
    inp.blur();
    showResults();
  }
  $("#searchForm").addEventListener("submit",e=>{e.preventDefault();submit()});
  $("#sx").onclick=()=>ov.remove();
}
function jobsMixedCase(s){
  s=String(s||"");
  if(s!==s.toUpperCase())return s;
  return s.toLowerCase().replace(/(^|[\s—–-])([a-z])/g,(m,p,c)=>p+c.toUpperCase());
}

function jobsOpeningHTML(ch,paras){
  const parts=String(ch.title||"").split(/\s+[—–-]\s+/,2);
  const chapNo=parts[0]||"";
  const chapTitle=parts[1]||"";
  let n=0;
  while(n<paras.length){
    const wc=String(paras[n]).trim().split(/\s+/).filter(Boolean).length;
    if(wc>18)break;
    n++;
  }
  const heads=paras.slice(0,n);
  const body=paras.slice(n);
  const headHTML=`<div class="jobsOpen">
    <div class="jobsChapNo">${esc(jobsMixedCase(chapNo))}</div>
    <div class="jobsChapTitle">${esc(jobsMixedCase(chapTitle))}</div>
    ${heads.map((x,i)=>`<div class="jobsSub jobsSub${Math.min(i+1,5)}">${esc(x)}</div>`).join("")}
  </div>`;
  return {headHTML,body};
}

function render(){
  const app=$("#app");
  if(state.screen==="library"){
    const zones=[
      [4.7,17.3,28.5,28.0],[36.8,17.3,28.5,28.0],[68.0,17.3,28.5,28.0],
      [4.7,45.8,28.5,28.0],[36.8,45.8,28.5,28.0],[68.0,45.8,28.5,28.0],
      [4.7,74.3,28.5,25.7],[36.8,74.3,28.5,25.7],[68.0,74.3,28.5,25.7]
    ];
    app.innerHTML=`<div class="libraryScreen"><div class="libraryArtWrap">
      <div class="libraryScroll"><div style="position:relative">
        <img class="libraryArt" src="assets/LIBRARY_BODY.png" alt="Library">
        ${LIB_ORDER.map((id,i)=>`<button class="libHit" data-id="${id}" style="left:${zones[i][0]}%;top:${zones[i][1]}%;width:${zones[i][2]}%;height:${zones[i][3]}%" aria-label="${id}"></button>`).join("")}
      </div></div>
      <img class="libraryBase" src="assets/LIBRARY_BASE.png" alt="">
<button class="adminHot" id="adminHot" type="button" aria-label="More"></button>
    </div></div>`;
    document.querySelectorAll(".libHit").forEach(b=>b.onclick=()=>openBook(b.dataset.id));

    // Hidden maintenance panel: deliberate 1.2s long-press on MORE.
    // Real transparent button sits above the inert Library base image.
    let at=null;
    const hot=$("#adminHot");
    const cancelAdmin=()=>{if(at){clearTimeout(at);at=null;}};
    const fireAdmin=()=>{
      cancelAdmin();
      at=setTimeout(()=>{
        at=null;
        document.querySelector(".adminPanel")?.remove();
        const panel=document.createElement("div");panel.className="adminPanel";
        panel.innerHTML=`<button id="resetTest">RESET</button><label class="importLabel">IMPORT<input id="fileInput" type="file" accept=".json"></label><button id="closeAdmin">CLOSE</button>`;
        app.appendChild(panel);
        $("#resetTest").onclick=()=>resetMagic();
        $("#fileInput").onchange=importBook;
        $("#closeAdmin").onclick=()=>panel.remove();
      },1200);
    };
    hot.addEventListener("contextmenu",e=>e.preventDefault());
    hot.addEventListener("pointerdown",e=>{e.preventDefault();fireAdmin()});
    ["pointerup","pointercancel","pointerleave"].forEach(ev=>hot.addEventListener(ev,cancelAdmin));
    // Older iOS fallback.
    hot.addEventListener("touchstart",e=>{e.preventDefault();if(!at)fireAdmin()},{passive:false});
    ["touchend","touchcancel","touchmove"].forEach(ev=>hot.addEventListener(ev,cancelAdmin,{passive:true}));
    return;
  }
  if(state.screen==="contents"){
    app.innerHTML=`<div class="top"><button id="back">LIBRARY</button><div class="title"><b>${esc(state.book.title)}</b></div>${state.book.id==="h2g2"&&magic.phase==="READY"?'<button id="searchBook">SEARCH</button>':''}</div>
      <div class="contents">
        <div class="contentsHead"><img src="${COVER[state.book.id]}" alt=""><div><h1>${esc(state.book.title)}</h1><p>${esc(state.book.author)}</p></div></div>
        ${state.book.chapters.map((c,i)=>`<button class="chapter" data-i="${i}">${esc(c.title)}</button>`).join("")}
      </div><div class="contentsBase"></div>`;
    $("#back").onclick=goLibrary;
    if($("#export"))$("#export").onclick=exportBook;
    if($("#searchBook"))$("#searchBook").onclick=openH2G2Search;
    document.querySelectorAll(".chapter").forEach(b=>b.onclick=()=>openChapter(+b.dataset.i));
    return;
  }
  const p=currentPage(),ch=state.book.chapters[state.ci];
  const shown=visibleParagraphs(p);
  let openingHTML=p.opener?`<h1>${esc(ch.title)}</h1>`:"";
  let bodyParas=shown;
  if(p.opener && state.book.id==="jobs"){
    const j=jobsOpeningHTML(ch,shown);
    openingHTML=j.headHTML;
    bodyParas=j.body;
  }
  app.innerHTML=`<div class="top"><button id="contents">CONTENTS</button><div class="title">${esc(state.book.title)} · ${esc(ch.title)}</div><button id="edit">EDIT</button></div>
    <div class="reader"><div class="page">${openingHTML}${bodyParas.map(x=>`<p>${esc(x)}</p>`).join("")}</div>
    <div class="hit left" id="left"></div><div class="hit right" id="right"></div>
    <div class="pageno">${absolutePage()} / ${totalBookPages()}</div></div>`;
  $("#contents").onclick=()=>{state.screen="contents";render()};
  $("#left").onclick=()=>pageMove(-1);$("#right").onclick=()=>pageMove(1);

  // iPhone horizontal flick navigation.
  const reader=document.querySelector(".reader");
  let touchX=null,touchY=null;
  reader.addEventListener("touchstart",e=>{
    if(e.touches.length!==1)return;
    touchX=e.touches[0].clientX; touchY=e.touches[0].clientY;
  },{passive:true});
  reader.addEventListener("touchend",e=>{
    if(touchX===null || !e.changedTouches.length)return;
    const dx=e.changedTouches[0].clientX-touchX;
    const dy=e.changedTouches[0].clientY-touchY;
    touchX=touchY=null;
    if(Math.abs(dx)>=45 && Math.abs(dx)>Math.abs(dy)*1.25){
      pageMove(dx<0 ? 1 : -1);
    }
  },{passive:true});

  // Hidden PAID -> CLEAN purge: deliberate 1.2 s long-press on EDIT.
  // EDIT remains a normal short-tap editor control; long-press while PAID silently purges.
  const editBtn=$("#edit");
  let cleanTimer=null, cleanFired=false;
  const cancelClean=()=>{if(cleanTimer){clearTimeout(cleanTimer);cleanTimer=null;}};
  editBtn.addEventListener("touchstart",e=>{
    if(magic.phase!=="PAID" || e.touches.length!==1)return;
    cleanFired=false;
    cleanTimer=setTimeout(()=>{
      cleanTimer=null; cleanFired=true; cleanMagic();
    },1200);
  },{passive:true});
  editBtn.addEventListener("touchmove",cancelClean,{passive:true});
  editBtn.addEventListener("touchend",cancelClean,{passive:true});
  editBtn.addEventListener("touchcancel",cancelClean,{passive:true});
  editBtn.onclick=e=>{
    if(cleanFired){cleanFired=false; e.preventDefault(); return;}
    openEditor();
  };

  beginDwell();
}
function openEditor(){
  const p=currentPage(),ch=state.book.chapters[state.ci],app=$("#app");
  const overlay=document.createElement("div");overlay.className="editor";
  overlay.innerHTML=`<div class="row"><b>EDITORIAL MODE</b><span class="dirty">${state.dirty.has(state.ci)?"chapter changed":""}</span><span style="flex:1"></span><button id="cancelEdit">CLOSE</button></div>
    <label>Chapter heading <input id="heading" value="${esc(ch.title)}"></label>
    <textarea id="pageText">${esc(p.paragraphs.join("\n\n"))}</textarea>
    <div class="row"><button id="saveEdit">SAVE PAGE</button><button id="repag">REPAGINATE CHAPTER</button><span style="flex:1"></span><button id="exportEdit">EXPORT BOOK</button></div>`;
  app.appendChild(overlay);
  $("#cancelEdit").onclick=()=>overlay.remove();
  $("#saveEdit").onclick=()=>saveEdit(false);
  $("#repag").onclick=()=>saveEdit(true);
  $("#exportEdit").onclick=exportBook;
}
function saveEdit(repaginate){
  const ch=state.book.chapters[state.ci],p=currentPage();
  ch.title=$("#heading").value.trim()||ch.title;
  p.paragraphs=$("#pageText").value.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  p.word_count=p.paragraphs.join(" ").trim().split(/\s+/).filter(Boolean).length;
  state.dirty.add(state.ci);
  if(repaginate) repaginateChapter(state.ci);
  saveLocal();render();
}
function repaginateChapter(ci){
  const ch=state.book.chapters[ci];
  const paragraphs=ch.pages.flatMap(p=>p.paragraphs);
  const opener=state.book.geometry?.chapter_opener_target_words||145;
  const follower=state.book.geometry?.follower_target_words||195;
  const pages=[];let cur=[],wc=0,budget=opener;
  function push(){if(!cur.length)return;pages.push({page_in_chapter:pages.length+1,opener:pages.length===0,paragraphs:cur,word_count:wc,chapter_index:ci+1,chapter_title:ch.title});cur=[];wc=0;budget=follower}
  for(const para of paragraphs){
    const words=para.split(/\s+/).filter(Boolean);
    if(cur.length && wc+words.length>budget)push();
    if(words.length>budget && !cur.length){
      let rest=[...words];
      while(rest.length>budget){cur=[""+rest.splice(0,budget).join(" ")];wc=budget;push()}
      if(rest.length){cur=[rest.join(" ")];wc=rest.length}
    }else{cur.push(para);wc+=words.length}
  }
  push();ch.pages=pages;state.pi=Math.min(state.pi,pages.length-1);
}
function exportBook(){
  if(!state.book)return;
  saveLocal();
  const blob=new Blob([JSON.stringify(state.book,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`${state.book.id}_EDITED.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function importBook(ev){
  const f=ev.target.files[0];if(!f)return;
  try{
    const b=JSON.parse(await f.text());
    if(!b.id||!Array.isArray(b.chapters))throw new Error("Not a NoBo book JSON");
    localStorage.setItem(key(b.id),JSON.stringify(b));cache.set(b.id,b);
    alert(`Imported ${b.title||b.id}`);
  }catch(e){alert("Import failed: "+e.message)}
  ev.target.value="";
}
document.addEventListener("keydown",e=>{
  if(document.querySelector(".editor"))return;
  if(state.screen==="reader"){if(e.key==="ArrowLeft")pageMove(-1);if(e.key==="ArrowRight")pageMove(1)}
})
init().catch(e=>document.body.innerHTML="<pre>"+esc(e.stack||e)+"</pre>");
</script></body></html>
